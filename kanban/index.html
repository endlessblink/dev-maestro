    // FILTER FUNCTIONALITY
    function applyFilters() {
      const typeFilter = document.getElementById('type-filter').value;
      const priorityFilter = document.getElementById('priority-filter').value;
      const searchQuery = currentSearchQuery;

      const allCards = document.querySelectorAll('.task-card');
      let visibleCount = 0;

      allCards.forEach(card => {
        const cardText = card.textContent.toLowerCase();
        const taskId = card.querySelector('.task-id')?.textContent || '';
        const priorityEl = card.querySelector('.task-priority');
        const priorityText = priorityEl ? priorityEl.textContent.toLowerCase() : '';

        // Determine task type from ID
        let taskType = 'task';
        if (taskId.startsWith('BUG-')) taskType = 'bug';
        else if (taskId.startsWith('ISSUE-')) taskType = 'issue';
        else if (taskId.startsWith('ROAD-')) taskType = 'road';

        // Check type filter
        const typeMatch = typeFilter === 'all' || taskType === typeFilter;

        // Check priority filter
        let priorityMatch = priorityFilter === 'all';
        if (!priorityMatch) {
          if (priorityFilter === 'p1') {
            priorityMatch = priorityText.includes('p1') || priorityText.includes('high');
          } else if (priorityFilter === 'p2') {
            priorityMatch = priorityText.includes('p2') || priorityText.includes('medium');
          } else if (priorityFilter === 'p3') {
            priorityMatch = priorityText.includes('p3') || priorityText.includes('low');
          }
        }

        // Check search query
        const searchMatch = searchQuery === '' || cardText.includes(searchQuery);

        // Apply visibility
        if (typeMatch && priorityMatch && searchMatch) {
          card.classList.remove('filter-hidden', 'search-dimmed');
          if (searchQuery !== '') {
            card.classList.add('search-highlight');
          } else {
            card.classList.remove('search-highlight');
          }
          visibleCount++;
        } else {
          card.classList.add('filter-hidden');
          card.classList.remove('search-highlight', 'search-dimmed');
        }
      });

      // Update results count
      const resultsCount = document.getElementById('search-results-count');
      const totalCards = allCards.length;
      if (typeFilter !== 'all' || priorityFilter !== 'all' || searchQuery !== '') {
        resultsCount.textContent = `${visibleCount} of ${totalCards} tasks`;
      } else {
        resultsCount.textContent = '';
      }

      // Save filter state
      localStorage.setItem('kanban-type-filter', typeFilter);
      localStorage.setItem('kanban-priority-filter', priorityFilter);

      // Update stats to reflect filtered view
      updateStats();
      updateDoneCount();
    }

      }
    }

    // Toggle hide done tasks
    function toggleHideDone() {
      const toggle = document.getElementById('hide-done-toggle');
      const isActive = toggle.classList.toggle('active');

      localStorage.setItem('kanban-hide-done', isActive);
      applyHideDone(isActive);
      updateStats();
    }

    // Apply hide done state
    function applyHideDone(hide) {
      // Find the Done column (the kanban-column containing column-done)
      const doneContent = document.getElementById('column-done');
      const doneColumn = doneContent?.closest('.kanban-column');
      if (doneColumn) {
        if (hide) {
          doneColumn.classList.add('done-column-hidden');
        } else {
          doneColumn.classList.remove('done-column-hidden');
        }
      }
    }

    // SORTING FUNCTIONALITY
    function applySorting() {
      const sortValue = document.getElementById('sort-select').value;
      localStorage.setItem('kanban-sort', sortValue);

      // Sort cards within each column
      const columns = ['column-todo', 'column-in-progress', 'column-review', 'column-done'];

      columns.forEach(columnId => {
        const column = document.getElementById(columnId);
        if (!column) return;

        const cards = Array.from(column.querySelectorAll('.task-card'));
        if (cards.length === 0) return;

        // Sort based on selected criteria
        cards.sort((a, b) => {
          const [sortBy, direction] = sortValue.split('-');
          const multiplier = direction === 'desc' ? -1 : 1;

          switch (sortBy) {
            case 'priority':
              return multiplier * comparePriority(a, b);
            case 'progress':
              return multiplier * compareProgress(a, b);
            case 'date':
              return multiplier * compareDate(a, b);
            case 'alpha':
              return multiplier * compareAlpha(a, b);
            default:
              return 0;
          }
        });

        // Re-append cards in sorted order
        cards.forEach(card => column.appendChild(card));
      });

      try {
        ensureTaskCopyButtons();
      } catch (error) {
        console.error('Copy button setup failed:', error);
      }

      // Re-initialize drag and drop listeners for new cards
      initDragAndDrop();
    }

    function ensureTaskCopyButtons() {
      const cards = document.querySelectorAll('.task-card');
      cards.forEach(card => {
        if (card.querySelector('.task-copy-btn')) return;

        const taskIdEl = card.querySelector('.task-id');
        const taskTitleEl = card.querySelector('.task-title');
        const taskId = taskIdEl && typeof taskIdEl.textContent === 'string' ? taskIdEl.textContent.trim() : '';
        const taskTitle = taskTitleEl && typeof taskTitleEl.textContent === 'string' ? taskTitleEl.textContent.trim() : '';
        if (!taskId || !taskTitle) return;

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'task-copy-btn';
        copyBtn.title = 'Copy task ID and title';
        copyBtn.setAttribute('aria-label', `Copy ${taskId} and task title`);
        copyBtn.dataset.taskId = taskId;
        copyBtn.dataset.taskTitle = taskTitle;
        copyBtn.innerHTML = COPY_ICON_SVG;
        copyBtn.addEventListener('click', (event) => copyTaskSummary(copyBtn, event));
        card.appendChild(copyBtn);
      });
    }

    async function copyTaskSummary(buttonEl, event) {
      event.preventDefault();
      event.stopPropagation();

      if (!buttonEl || !buttonEl.dataset) return;
      const taskId = buttonEl.dataset.taskId || '';
      const encodedCopyText = buttonEl.dataset.copyText || '';
      const textToCopy = encodedCopyText
        ? decodeURIComponent(encodedCopyText)
        : `${taskId} ${buttonEl.dataset.taskTitle || ''}`.trim();
      if (!textToCopy) return;

      try {
        await writeTextToClipboard(textToCopy);
        buttonEl.classList.add('copied');
        setTimeout(() => buttonEl.classList.remove('copied'), 900);
        showToast(`✓ Copied ${taskId}`, 'success');
      } catch (error) {
        console.error('Copy failed:', error);
        showToast('✗ Failed to copy task info', 'error');
      }
    }

    function writeTextToClipboard(text) {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        return navigator.clipboard.writeText(text);
      }

      return new Promise((resolve, reject) => {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(textarea);
          if (ok) resolve();
          else reject(new Error('document.execCommand("copy") failed'));
        } catch (error) {
          reject(error);
        }
      });
    }

    // Priority comparison (P1/HIGH > P2/MEDIUM > P3/LOW)
    function comparePriority(cardA, cardB) {
      const getPriorityValue = (card) => {
        const priorityEl = card.querySelector('.task-priority');
        if (!priorityEl) return 0;
        const text = priorityEl.textContent.toLowerCase();
        if (text.includes('p1') || text.includes('high')) return 3;
        if (text.includes('p2') || text.includes('medium')) return 2;
        if (text.includes('p3') || text.includes('low')) return 1;
        return 0;
      };
      return getPriorityValue(cardA) - getPriorityValue(cardB);
    }

    // Progress comparison (by percentage)
    function compareProgress(cardA, cardB) {
      const getProgress = (card) => {
        const progressEl = card.querySelector('.progress-percent');
        if (!progressEl) return 0;
        return parseInt(progressEl.textContent) || 0;
      };
      return getProgress(cardA) - getProgress(cardB);
    }

    // Date comparison (by task ID number - higher = newer)
    function compareDate(cardA, cardB) {
      const getIdNumber = (card) => {
        const idEl = card.querySelector('.task-id');
        if (!idEl) return 0;
        const match = idEl.textContent.match(/(\d+)/);
        return match ? parseInt(match[1]) : 0;
      };
      return getIdNumber(cardA) - getIdNumber(cardB);
    }

    // Alphabetical comparison (by title)
    function compareAlpha(cardA, cardB) {
      const getTitle = (card) => {
        const titleEl = card.querySelector('.task-title');
        return titleEl ? titleEl.textContent.toLowerCase() : '';
      };
      return getTitle(cardA).localeCompare(getTitle(cardB));
    }

    // STATISTICS FUNCTIONALITY
    function updateStats() {
      const allCards = document.querySelectorAll('.task-card');

      let total = 0, todo = 0, inProgress = 0, done = 0;
      let tasks = 0, bugs = 0, issues = 0;

      allCards.forEach(card => {
        // Skip hidden cards from filters
        if (card.classList.contains('filter-hidden')) return;

        total++;

        // Get task ID to determine type
        const taskId = card.querySelector('.task-id')?.textContent || '';
        if (taskId.startsWith('TASK-')) tasks++;
        else if (taskId.startsWith('BUG-')) bugs++;
        else if (taskId.startsWith('ISSUE-')) issues++;

        // Get column to determine status by checking parent container ID
        const parent = card.closest('[id^="column-"]');
        if (parent) {
          if (parent.id === 'column-todo') todo++;
          else if (parent.id === 'column-in-progress') inProgress++;
          else if (parent.id === 'column-done') done++;
        }
      });

      // Update DOM
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-todo').textContent = todo;
      document.getElementById('stat-progress').textContent = inProgress;
      document.getElementById('stat-done').textContent = done;
      document.getElementById('stat-tasks').textContent = tasks;
      document.getElementById('stat-bugs').textContent = bugs;
      document.getElementById('stat-issues').textContent = issues;

      // Calculate completion percentage
      const completion = total > 0 ? Math.round((done / total) * 100) : 0;
      document.getElementById('stat-completion').textContent = completion + '%';
      document.getElementById('stat-progress-fill').style.width = completion + '%';
    }

    // COLLAPSE DONE COLUMN
    function toggleDoneColumn() {
      const header = document.getElementById('done-header');
      const content = document.getElementById('column-done');
      const toggle = header.querySelector('.collapse-toggle');

      const isCollapsed = content.classList.toggle('collapsed');
      header.classList.toggle('collapsed', isCollapsed);

      // Save state to localStorage
      localStorage.setItem('kanban-done-collapsed', isCollapsed);

      // Update toggle icon
      toggle.textContent = isCollapsed ? '▶' : '▼';
    }

    function loadDoneColumnState() {
      const isCollapsed = localStorage.getItem('kanban-done-collapsed') === 'true';
      if (isCollapsed) {
        const header = document.getElementById('done-header');
        const content = document.getElementById('column-done');
        const toggle = header.querySelector('.collapse-toggle');

        content.classList.add('collapsed');
        header.classList.add('collapsed');
        toggle.textContent = '▶';
      }
    }

    function updateDoneCount() {
      const doneContent = document.getElementById('column-done');
      const count = doneContent ? doneContent.querySelectorAll('.task-card:not(.filter-hidden)').length : 0;
      const countEl = document.getElementById('done-count');
      if (countEl) {
        countEl.textContent = count;
      }
    }

    // DRAG AND DROP FUNCTIONALITY
    function initDragAndDrop() {
      const cards = document.querySelectorAll('.task-card');
      const columns = document.querySelectorAll('.column-cards');

      cards.forEach(card => {
        card.addEventListener('dragstart', (e) => {
          card.classList.add('dragging');
          e.dataTransfer.setData('text/plain', card.querySelector('.task-id')?.textContent || '');
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          columns.forEach(col => col.classList.remove('drag-over'));
        });
      });

      columns.forEach(column => {
        column.addEventListener('dragover', (e) => {
          e.preventDefault();
          column.classList.add('drag-over');
        });

        column.addEventListener('dragleave', () => {
          column.classList.remove('drag-over');
        });

        column.addEventListener('drop', async (e) => {
          e.preventDefault();
          column.classList.remove('drag-over');

          const card = document.querySelector('.dragging');
          if (!card) return;

          // Determine target status from column ID
          const columnId = column.id;
          let newStatus = 'todo';

          if (columnId === 'column-todo') newStatus = 'todo';
          else if (columnId === 'column-in-progress') newStatus = 'in-progress';
          else if (columnId === 'column-paused') newStatus = 'paused';
          else if (columnId === 'column-review') newStatus = 'review';
          else if (columnId === 'column-done') newStatus = 'done';
          else return; // Unknown column

          const taskId = card.getAttribute('data-id');
          if (!taskId) return;

          // Optimistically move card
          column.appendChild(card);

          // Call API
          try {
            showToast(`Updating ${taskId} to ${newStatus}...`, 'info');
            const response = await fetch(`${API_BASE}/api/task/${taskId}/status`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: newStatus })
            });

            const result = await response.json();
            if (result.success) {
              showToast(`✓ ${taskId} moved to ${newStatus.toUpperCase()}`, 'success');
              // Optional: Refresh data to ensure sort order/consistency
              setTimeout(() => renderKanban(), 500);
            } else {
              showToast(`✗ Failed to update status`, 'error');
              // Revert move? (Requires complex logic, usually refresh fixes it)
              setTimeout(() => renderKanban(), 1000);
            }
          } catch (err) {
            console.error(err);
            showToast('✗ Server error', 'error');
          }
        });
      });
    }

    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Simple markdown to HTML converter
    function renderMarkdown(text) {
      if (!text) return '';
      return text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')  // **bold**
        .replace(/`([^`]+)`/g, '<code>$1</code>')  // `code`
        .replace(/\[x\]/gi, '✅')  // [x] checkbox
        .replace(/\[\s?\]/g, '☐')  // [ ] checkbox
        .replace(/~~(.+?)~~/g, '<s style="opacity:0.6">$1</s>');  // ~~strikethrough~~
    }

    // Parse description into structured sections (Goal, Priority, Design Reference, etc.)
    function parseStructuredDescription(description) {
      if (!description) return { sections: [], otherContent: '' };

      const sections = [];
      const lines = description.split('\n');
      let currentSection = null;
      let otherLines = [];

      // Known section patterns (bold labels at start of line)
      const sectionPatterns = [
        { pattern: /^\*\*Goal\*\*:?\s*/i, type: 'goal', label: 'Goal' },
        { pattern: /^\*\*Priority\*\*:?\s*/i, type: 'priority', label: 'Priority' },
        { pattern: /^\*\*Design Reference\*\*/i, type: 'reference', label: 'Design Reference' },
        { pattern: /^\*\*Design Token Added\*\*/i, type: 'reference', label: 'Design Tokens' },
        { pattern: /^\*\*Where We Stopped\*\*:?\s*/i, type: 'progress', label: 'Current Status' },
        { pattern: /^\*\*Baseline\*\*/i, type: 'notes', label: 'Baseline' },
        { pattern: /^\*\*Progress\*\*:?\s*/i, type: 'progress', label: 'Progress' },
        { pattern: /^\*\*After.*\*\*:?\s*/i, type: 'notes', label: 'Notes' },
        { pattern: /^\*\*Final\*\*/i, type: 'progress', label: 'Final Status' },
        { pattern: /^\*\*Completed.*\*\*:?\s*/i, type: 'progress', label: 'Completed' },
        { pattern: /^\*\*Remaining.*\*\*\s*/i, type: 'notes', label: 'Remaining' },
        { pattern: /^\*\*Files Fixed\*\*/i, type: 'notes', label: 'Files Fixed' },
      ];

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;

        // Check if line starts a new section
        let matched = false;
        for (const { pattern, type, label } of sectionPatterns) {
          if (pattern.test(trimmed)) {
            // Save previous section if exists
            if (currentSection && currentSection.content.length > 0) {
              sections.push(currentSection);
            }
            // Start new section - extract content after the label
            const content = trimmed.replace(pattern, '').trim();
            currentSection = { type, label, content: content ? [content] : [] };
            matched = true;
            break;
          }
        }

        if (!matched) {
          // Add to current section or other content
          if (currentSection) {
            // Check if this is a bullet point or continuation
            if (trimmed.startsWith('-') || trimmed.startsWith('•')) {
              currentSection.content.push(trimmed);
            } else if (!trimmed.startsWith('|')) {  // Skip table rows
              currentSection.content.push(trimmed);
            }
          } else {
            otherLines.push(trimmed);
          }
        }
      }

      // Don't forget the last section
      if (currentSection && currentSection.content.length > 0) {
        sections.push(currentSection);
      }

      return { sections, otherContent: otherLines.join('\n') };
    }

    // Build structured HTML for expanded task content
    function buildExpandedContentHtml(task) {
      const { sections, otherContent } = parseStructuredDescription(task.description);
      const hasSubtasks = task.subtasks && task.subtasks.length > 0;

      let html = '';

      // Quick stats badges
      const completed = task.completedSubtasks || 0;
      const total = hasSubtasks ? task.subtasks.length : 0;
      const priorityText = task.priority || '';
      const isHighPriority = priorityText.toLowerCase().includes('p1') || priorityText.toLowerCase().includes('high');
      const isMediumPriority = priorityText.toLowerCase().includes('p2') || priorityText.toLowerCase().includes('medium');

      if (hasSubtasks || isHighPriority || isMediumPriority) {
        html += '<div class="quick-stats">';
        if (isHighPriority) {
          html += '<span class="stat-badge priority-high"><span class="priority-dot high"></span>High Priority</span>';
        } else if (isMediumPriority) {
          html += '<span class="stat-badge priority-medium"><span class="priority-dot medium"></span>Medium Priority</span>';
        }
        if (hasSubtasks) {
          const percent = Math.round((completed / total) * 100);
          html += `<span class="stat-badge subtasks">${ICONS.task}${completed}/${total} subtasks (${percent}%)</span>`;
        }
        html += '</div>';
      }

      // Structured sections
      for (const section of sections) {
        html += `<div class="detail-section ${section.type}">`;
        html += `<div class="detail-label">${section.label}</div>`;
        html += `<div class="detail-content">${renderMarkdown(section.content.join('<br>'))}</div>`;
        html += '</div>';
      }

      // Other content (if any)
      if (otherContent) {
        html += `<div class="detail-section notes">`;
        html += `<div class="detail-label">Details</div>`;
        html += `<div class="detail-content">${renderMarkdown(otherContent)}</div>`;
        html += '</div>';
      }

      // Subtasks with categories
      if (hasSubtasks) {
        html += '<div class="task-subtasks">';
        html += `<div class="subtask-header">Checklist <span class="subtask-progress">${completed}/${total} complete</span></div>`;

        // Group subtasks by category headers (lines ending with colon or containing parentheses like "Base Components (8):")
        let currentCategory = null;

        for (const st of task.subtasks) {
          const trimmed = st.trim();

          // Check if this is a category header (e.g., "Base Components (8):" or "**UI Components**:")
          const categoryMatch = trimmed.match(/^\*?\*?([^*]+)\*?\*?\s*\(\d+\):?$/) ||
            trimmed.match(/^\*?\*?([^*:]+)\*?\*?:$/);

          if (categoryMatch) {
            currentCategory = categoryMatch[1].trim();
            html += `<div class="subtask-category">${currentCategory}</div>`;
            continue;
          }

          const isCompleted = st.includes('[x]') || st.includes('✅') ||
            st.includes('~~') || st.toLowerCase().includes('done') ||
            st.includes('✓');
          const text = st.replace(/\[x\]|\[\s?\]|✅|✓|-\s+/gi, '').trim();

          html += `<div class="subtask ${isCompleted ? 'completed' : ''}">`;
          html += `<span class="subtask-icon">${isCompleted ? '✓' : '○'}</span>`;
          html += `<span class="subtask-text">${renderMarkdown(text)}</span>`;
          html += '</div>';
        }

        html += '</div>';
      }

      return html;
    }

    // Expandable task card functions
    function toggleExpand(taskId, event) {
      event.stopPropagation(); // Don't trigger card click
      const card = document.querySelector(`[data-id="${taskId}"]`);
      if (!card) return;

      const expanded = card.querySelector('.task-expanded');
      const toggle = card.querySelector('.expand-toggle');
      if (!expanded || !toggle) return;

      const isExpanded = expanded.style.display !== 'none';
      expanded.style.display = isExpanded ? 'none' : 'block';
      toggle.textContent = isExpanded ? '▶' : '▼';

      saveExpandState(taskId, !isExpanded);
    }

    function getExpandState(taskId) {
      const states = JSON.parse(localStorage.getItem('kanban-expand-states') || '{}');
      return states[taskId] || false;
    }

    function saveExpandState(taskId, isExpanded) {
      const states = JSON.parse(localStorage.getItem('kanban-expand-states') || '{}');
      states[taskId] = isExpanded;
      localStorage.setItem('kanban-expand-states', JSON.stringify(states));
    }

    function refreshData() {
      renderKanban();
      showStatus('Refreshed!');
    }

    function showStatus(message) {
      // Create temporary status message
      const status = document.createElement('div');
      status.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: var(--border-subtle); /* #1a1a1a */
        color: var(--color-success); /* #10b981 */
        border: 1px solid var(--color-success); /* #10b981 */
        padding: 12px 20px;
        border-radius: var(--radius-sm);
        z-index: 1000;
      `;
      status.textContent = message;
      document.body.appendChild(status);

      setTimeout(() => {
        status.remove();
      }, 2000);
    }

    // Add slide animations
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes slideOut {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
      }
    `;
    document.head.appendChild(style);

    // Initial load
    document.addEventListener('DOMContentLoaded', function () {
      // Safety: Close any stuck modals
      closeTaskModal();
      document.body.style.overflow = 'auto';

      // Remove any potential overlays
      const modals = document.querySelectorAll('.task-modal.active');
      modals.forEach(modal => modal.classList.remove('active'));

      // Clear any stuck status messages
      const statusElements = document.querySelectorAll('[style*="position: fixed"]');
      statusElements.forEach(el => el.remove());

      // Initial render
      renderKanban();
    });

    // Auto-refresh when page becomes visible (tab switch, navigation back)
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        console.log('Page visible - refreshing data...');
        renderKanban();
      }
    });

    // Also refresh on window focus (for same-tab navigation)
    window.addEventListener('focus', function () {
      console.log('Window focused - refreshing data...');
      renderKanban();
    });

    // ===== LIVE FILE SYNC (SSE) =====
    let eventSource = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT_ATTEMPTS = 5;

    function connectSSE() {
      if (eventSource) {
        eventSource.close();
      }

      console.log('[SSE] Connecting to live sync...');
      eventSource = new EventSource(`${API_BASE}/api/events`);

      eventSource.onopen = () => {
        console.log('[SSE] Connected to live sync');
        reconnectAttempts = 0;
        showToast('Live sync connected', 'success');
      };

      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          console.log('[SSE] Received:', data);

          if (data.type === 'file-changed') {
            console.log('[SSE] MASTER_PLAN.md changed externally - refreshing...');
            showToast('MASTER_PLAN.md updated - refreshing...', 'info');
            // Debounce to avoid multiple rapid refreshes
            setTimeout(() => renderKanban(), 300);
          }
        } catch (e) {
          console.error('[SSE] Parse error:', e);
        }
      };

      eventSource.onerror = (error) => {
        console.error('[SSE] Connection error:', error);
        eventSource.close();

        if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
          reconnectAttempts++;
          const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
          console.log(`[SSE] Reconnecting in ${delay}ms (attempt ${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
          setTimeout(connectSSE, delay);
        } else {
          console.log('[SSE] Max reconnect attempts reached. Live sync disabled.');
          showToast('Live sync disconnected', 'warning');
        }
      };
    }

    // Start SSE connection on load
    document.addEventListener('DOMContentLoaded', () => {
      // Delay SSE connection to let server start
      setTimeout(connectSSE, 1000);
    });

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (eventSource) {
        eventSource.close();
      }
    });
    // ===== END LIVE FILE SYNC =====

    // Listen for project switch from parent frame
    window.addEventListener('message', (e) => {
      if (e.data?.type === 'switch-project') {
        renderKanban();
      }
    });
  </script>
