async function handleContextCommand(cmd, projectName) {
    const project = allProjects.find(p => p.name === projectName);
    if (!project) return;

    if (cmd === 'copy-path') {
        await copyText('cd ' + project.root);
        showToast('Path copied!', 'clipboard');

    } else if (cmd === 'kickstart') {
        const data = await apiFetch(`/api/projects/${encodeURIComponent(projectName)}/kickstart`);
        const prompt = data?.prompt || data?.text || `Project: ${project.name}\nPath: ${project.root}`;
        await copyText(prompt);
        showToast('Kickstart prompt copied!', 'rocket');

    } else if (cmd === 'archive' || cmd === 'unarchive') {
        const res = await apiFetch(`/api/projects/${encodeURIComponent(projectName)}/archive`, { method: 'POST' });
        project.archived = !project.archived;
        showToast(project.archived ? 'Project archived' : 'Project unarchived', 'check');
        renderProjects();
        if (detailProject?.name === projectName) openDetail(projectName);

    } else if (cmd === 'browse-covers') {
        // Fetch cover history from API
        let versions = [];
        try {
            versions = await apiFetch(`/api/projects/${encodeURIComponent(projectName)}/covers`);
        } catch { versions = []; }

        const gallery = document.getElementById('coverGalleryBackdrop');
        const grid = document.getElementById('coverGalleryGrid');
        document.getElementById('coverGalleryTitle').textContent = `Covers — ${projectName}`;

        if (!versions || !versions.length) {
            grid.innerHTML = '<div class="cover-gallery-empty">No covers generated yet.<br>Use "Create Cover" to generate one.</div>';
        } else {
            grid.innerHTML = versions.map(v => {
                const date = new Date(v.timestamp);
                const label = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                return `<div class="cover-gallery-item${v.current ? ' current' : ''}" data-cover-url="${v.url}" data-project="${projectName}">` +
                    `<img src="${v.url}?t=${Date.now()}" alt="Cover version">` +
                    `<div class="cover-gallery-item-label">${label}</div>` +
                    `</div>`;
            }).join('');
        }

        gallery.style.display = 'flex';
        requestAnimationFrame(() => gallery.classList.add('open'));

    } else if (cmd === 'generate-cover') {
        if (generatingCovers.has(projectName)) { showToast('Already generating...', 'clock'); return; }
        generatingCovers.add(projectName);
        // Find the card element and show a loading overlay
        const card = document.querySelector(`[data-name="${CSS.escape(projectName)}"]`);
        const coverEl = card?.querySelector('.card-cover-gradient, .list-thumb');
        const origContent = coverEl?.innerHTML;
        if (coverEl) {
            coverEl.style.position = 'relative';
            coverEl.insertAdjacentHTML('beforeend', '<div class="cover-generating" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);border-radius:inherit;"><div class="spinner"></div><span style="margin-left:8px;font-size:11px;color:#ccc;">Generating...</span></div>');
        }
        showToast('Generating AI cover...', 'rocket');
        let res;
        try {
            const raw = await fetch(`/api/projects/${encodeURIComponent(projectName)}/generate-cover`, { method: 'POST' });
            res = await raw.json();
        } catch { res = null; }
        // Remove loading overlay
        const overlay = coverEl?.querySelector('.cover-generating');
        if (overlay) overlay.remove();
        if (res?.success && res?.coverUrl) {
            project.cover = res.coverUrl + '?t=' + Date.now();
            showToast('Cover generated!', 'check');
            renderProjects();
            if (detailProject?.name === projectName) openDetail(projectName);
        } else {
            showToast(res?.error || 'Cover generation failed', 'error');
        }
        generatingCovers.delete(projectName);

    } else if (cmd === 'delete') {
        if (!confirm(`Delete project "${projectName}" from Watchpost?\n\nThis only removes it from Watchpost — your files stay on disk.`)) return;
        await apiFetch(`/api/projects/${encodeURIComponent(projectName)}`, { method: 'DELETE' });
        allProjects = allProjects.filter(p => p.name !== projectName);
        showToast('Project removed', 'check');
        renderProjects();
        if (detailProject?.name === projectName) closeDetail();
    }
}

        apiFetch(`/api/projects/${encodeURIComponent(name)}/summary`),
    ]);

    const summaryEl = document.getElementById('detailSummaryText');
    if (summaryEl) {
        const text = summaryData?.narrative || summaryData?.summary || summaryData?.text || null;
        summaryEl.style.fontStyle = text ? 'normal' : 'italic';
        summaryEl.textContent = text || 'No summary available.';
    }

    const commitsEl = document.getElementById('detailCommits');
    if (commitsEl) {
        const commits = summaryData?.recentCommits || statsData?.commits || summaryData?.commits || [];
        if (commits.length) {
            commitsEl.innerHTML = commits.slice(0, 6).map(c => {
                const msg = typeof c === 'string' ? c : (c.message || c.msg || JSON.stringify(c));
                return `<div class="commit-item">${escHtml(msg)}</div>`;
            }).join('');
        } else {
            commitsEl.innerHTML = '<div style="color:var(--text-subtle);font-size:var(--font-sm);font-style:italic;">No recent commits found.</div>';
        }
    }

async function addNote(text) {
    if (!text.trim()) return;
    const data = await apiFetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text.trim(), type: 'task' })
    });

    if (data) {
        notes.unshift(data);
    } else {
        // Optimistic fallback
        notes.unshift({ id: Date.now(), text: text.trim(), done: false, createdAt: new Date().toISOString() });
    }
    renderNotes();
}

async function toggleNote(id) {
    const note = notes.find(n => String(n.id) === String(id));
    if (!note) return;
    note.done = !note.done;
    renderNotes();

    await apiFetch(`/api/notes/${encodeURIComponent(id)}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done: note.done })
    });
}

async function deleteNote(id) {
    notes = notes.filter(n => String(n.id) !== String(id));
    renderNotes();
    await apiFetch(`/api/notes/${encodeURIComponent(id)}`, { method: 'DELETE' });
}

// ── Command Palette ───────────────────────────────────────────────────────
let cmdPaletteOpen = false;
let cmdHighlightIdx = 0;
let cmdFilteredProjects = [];

function fuzzyMatch(query, text) {
    const q = query.toLowerCase();
    const t = text.toLowerCase();
    // Substring match first
    if (t.includes(q)) return true;
    // Fuzzy: all chars must appear in order
    let qi = 0;
    for (let i = 0; i < t.length && qi < q.length; i++) {
        if (t[i] === q[qi]) qi++;
    }
    return qi === q.length;
}

function getActivityColor(p) {
    const c = p.commits7d || 0;
    if (c >= 5) return 'var(--color-success)';   // green — active
    if (c >= 1) return 'var(--color-warning)';    // amber — some activity
    return 'var(--text-subtle)';                   // gray — stale
}

function openCmdPalette() {
    cmdPaletteOpen = true;
    cmdHighlightIdx = 0;
    const backdrop = document.getElementById('cmdPalette');
    const input = document.getElementById('cmdPaletteInput');
    backdrop.style.display = 'flex';
    input.value = '';
    // Trigger animation
    requestAnimationFrame(() => {
        backdrop.classList.add('visible');
        input.focus();
    });
    renderCmdPaletteResults();
}

function closeCmdPalette() {
    cmdPaletteOpen = false;
    const backdrop = document.getElementById('cmdPalette');
    backdrop.classList.remove('visible');
    setTimeout(() => { backdrop.style.display = 'none'; }, 200);
}

function toggleCmdPalette() {
    cmdPaletteOpen ? closeCmdPalette() : openCmdPalette();
}

function renderCmdPaletteResults() {
    const query = document.getElementById('cmdPaletteInput').value.trim();
    const container = document.getElementById('cmdPaletteResults');

    // Get recent projects from localStorage
    const recentNames = JSON.parse(localStorage.getItem('cr-recent-projects') || '[]');

    let filtered;
    if (!query) {
        // Spotlight mode: recent + active only, don't dump all projects
        const recent = recentNames
            .map(name => allProjects.find(p => p.name === name))
            .filter(Boolean)
            .slice(0, 5);

        // Active projects (with commits this week, not already in recent)
        const recentSet = new Set(recentNames);
        const active = allProjects
            .filter(p => !p.archived && !recentSet.has(p.name) && (p.commits7d || 0) >= 1)
            .sort((a, b) => (b.commits7d || 0) - (a.commits7d || 0))
            .slice(0, 5);

        let html = '';
        if (recent.length) {
            html += `<div class="cmd-palette-group-label">Recent</div>`;
            recent.forEach((p, i) => {
                html += cmdPaletteItemHtml(p, i);
            });
        }

        if (active.length) {
            html += `<div class="cmd-palette-group-label">Active This Week</div>`;
            active.forEach((p, i) => {
                html += cmdPaletteItemHtml(p, i + recent.length);
            });
        }

        cmdFilteredProjects = [...recent, ...active];

        const remaining = allProjects.filter(p => !p.archived).length - cmdFilteredProjects.length;
        if (remaining > 0) {
            html += '<div class="cmd-palette-empty" style="padding:1rem;font-style:italic;">Type to search ' + remaining + ' more projects...</div>';
        }

        container.innerHTML = html || '<div class="cmd-palette-empty">No projects loaded</div>';
        cmdHighlightIdx = 0;
        updateCmdHighlight();
        return;
    } else {
        filtered = allProjects.filter(p => fuzzyMatch(query, p.name));
        // Sort: exact prefix first, then includes, then fuzzy
        const ql = query.toLowerCase();
        filtered.sort((a, b) => {
            const aStart = a.name.toLowerCase().startsWith(ql) ? 0 : 1;
            const bStart = b.name.toLowerCase().startsWith(ql) ? 0 : 1;
            if (aStart !== bStart) return aStart - bStart;
            const aInc = a.name.toLowerCase().includes(ql) ? 0 : 1;
            const bInc = b.name.toLowerCase().includes(ql) ? 0 : 1;
            return aInc - bInc;
        });

        cmdFilteredProjects = filtered;

        if (!filtered.length) {
            container.innerHTML = '<div class="cmd-palette-empty">No matching projects</div>';
            return;
        }

        let html = '';
        // Group by category
        const byCategory = new Map();
        for (const p of filtered) {
            const cat = p._category || 'Uncategorized';
            if (!byCategory.has(cat)) byCategory.set(cat, []);
            byCategory.get(cat).push(p);
        }

        let globalIdx = 0;
        for (const [cat, projects] of byCategory) {
            if (byCategory.size > 1) {
                html += `<div class="cmd-palette-group-label">${escHtml(cat)}</div>`;
            }
            for (const p of projects) {
                html += cmdPaletteItemHtml(p, globalIdx);
                globalIdx++;
            }
        }

        container.innerHTML = html;
    }

    cmdHighlightIdx = 0;
    updateCmdHighlight();
}

function cmdPaletteItemHtml(p, idx) {
    const gradient = projectGradient(p.name);
    const thumbStyle = p.cover
        ? `background-image: url(${escHtml(p.cover)}); background-size: cover; background-position: center;`
        : `background: ${gradient};`;
    const initial = p.name.charAt(0);
    const actColor = getActivityColor(p);
    const catColor = getCategoryColor(p._category || 'Uncategorized');
    // Shorten the path: show last 2 segments
    const pathParts = (p.root || '').split('/').filter(Boolean);
    const shortPath = pathParts.slice(-2).join('/');

    return `
    <div class="cmd-palette-item" data-cmd-idx="${idx}" data-cmd-name="${escHtml(p.name)}">
        <div class="cmd-palette-thumb" style="${thumbStyle}">
            ${!p.cover ? `<span class="cmd-palette-thumb-initial">${escHtml(initial)}</span>` : ''}
        </div>
        <div class="cmd-palette-item-info">
            <div class="cmd-palette-item-name">${escHtml(p.name)}</div>
            <div class="cmd-palette-item-path">${escHtml(shortPath)}</div>
        </div>
        <div class="cmd-palette-item-meta">
            <span class="cmd-palette-cat-badge" style="border-left: 2px solid ${catColor}">${escHtml(p._category || '')}</span>
            <span class="cmd-palette-activity-dot" style="background: ${actColor}" title="${p.commits7d || 0} commits this week"></span>
        </div>
    </div>`;
}

function updateCmdHighlight() {
    const items = document.querySelectorAll('.cmd-palette-item');
    items.forEach((el, i) => {
        el.classList.toggle('highlighted', i === cmdHighlightIdx);
    });
    // Scroll highlighted into view
    const highlighted = document.querySelector('.cmd-palette-item.highlighted');
    if (highlighted) highlighted.scrollIntoView({ block: 'nearest' });
}

function selectCmdPaletteItem(name) {
    // Save to recent
    let recent = JSON.parse(localStorage.getItem('cr-recent-projects') || '[]');
    recent = [name, ...recent.filter(n => n !== name)].slice(0, 8);
    localStorage.setItem('cr-recent-projects', JSON.stringify(recent));

    closeCmdPalette();

    // Open the project detail
    const project = allProjects.find(p => p.name === name);
    if (project) openDetail(name);
}

// Command palette event listeners
document.getElementById('cmdPaletteInput').addEventListener('input', () => {
    renderCmdPaletteResults();
});

document.getElementById('cmdPalette').addEventListener('click', (e) => {
    // Close on backdrop click
    if (e.target.id === 'cmdPalette') { closeCmdPalette(); return; }
    // Select item
    const item = e.target.closest('.cmd-palette-item');
    if (item) selectCmdPaletteItem(item.dataset.cmdName);
});

document.getElementById('cmdPaletteInput').addEventListener('keydown', (e) => {
    const total = cmdFilteredProjects.length;
    if (e.key === 'ArrowDown') {
        e.preventDefault();
        cmdHighlightIdx = (cmdHighlightIdx + 1) % Math.max(total, 1);
        updateCmdHighlight();
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        cmdHighlightIdx = (cmdHighlightIdx - 1 + Math.max(total, 1)) % Math.max(total, 1);
        updateCmdHighlight();
    } else if (e.key === 'Enter') {
        e.preventDefault();
        if (cmdFilteredProjects[cmdHighlightIdx]) {
            selectCmdPaletteItem(cmdFilteredProjects[cmdHighlightIdx].name);
        }
    } else if (e.key === 'Escape') {
        e.preventDefault();
        closeCmdPalette();
    }
});

// ── Topbar project button → opens command palette
document.getElementById('topbarProjectBtn').addEventListener('click', () => {
    openCmdPalette();
});

// ── Settings popover toggle
document.getElementById('topbarSettingsBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const popover = document.getElementById('settingsPopover');

});

// ── Event wiring ───────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', renderProjects);

document.getElementById('filterChips').addEventListener('click', (e) => {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    const cat = chip.dataset.category;
    if (activeCategory === cat && cat !== 'all') {
        activeCategory = 'all'; // Toggle off
    } else {
        activeCategory = cat;
    }
    renderProjects();
});

document.getElementById('showArchived').addEventListener('change', (e) => {
    showArchived = e.target.checked;
    renderProjects();
});

document.getElementById('viewGrid').addEventListener('click', () => {
    currentView = 'grid';
    document.getElementById('viewGrid').classList.add('active');
    document.getElementById('viewList').classList.remove('active');
    renderProjects();
});

document.getElementById('viewList').addEventListener('click', () => {
    currentView = 'list';
    document.getElementById('viewList').classList.add('active');
    document.getElementById('viewGrid').classList.remove('active');
    renderProjects();
});

document.getElementById('sortSelect').addEventListener('change', (e) => {
    currentSort = e.target.value;
    localStorage.setItem('cr-sort', currentSort);
    renderProjects();
});

document.getElementById('groupBySelect').addEventListener('change', (e) => {
    currentGroupBy = e.target.value;
    localStorage.setItem('cr-groupby', currentGroupBy);
    activeCategory = 'all';
    collapsedCategories.clear();
    renderProjects();
});

// Close on overlay background click (but not on panel itself)
document.getElementById('detailOverlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('detailOverlay')) closeDetail();
});
// Close button is injected dynamically — use event delegation on panel
document.getElementById('detailPanel').addEventListener('click', (e) => {
    if (e.target.closest('#detailClose')) closeDetail();
});

document.getElementById('notesHeaderToggle').addEventListener('click', (e) => {
    if (e.target.closest('button') === null) return; // Only toggle on btn click
});

document.getElementById('notesToggleBtn').addEventListener('click', () => {
    notesCollapsed = !notesCollapsed;
    const body = document.getElementById('notesBody');
    const btn = document.getElementById('notesToggleBtn');
    if (notesCollapsed) {
        body.classList.add('hidden');
        btn.classList.add('collapsed');
        btn.title = 'Expand';
    } else {
        body.classList.remove('hidden');
        btn.classList.remove('collapsed');
        btn.title = 'Collapse';
    }
});

document.getElementById('noteInput').addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') {
        const val = e.target.value;
        e.target.value = '';
        await addNote(val);
    }
});

document.getElementById('noteAddBtn').addEventListener('click', async () => {
    const input = document.getElementById('noteInput');
    const val = input.value;
    input.value = '';
    await addNote(val);
});

document.getElementById('notesList').addEventListener('change', async (e) => {
    if (e.target.classList.contains('note-check')) {
        await toggleNote(e.target.dataset.noteId);
    }
});

document.getElementById('notesList').addEventListener('click', async (e) => {
    const btn = e.target.closest('.note-delete');
    if (btn) {
        await deleteNote(btn.dataset.noteId);
    }
});

document.getElementById('notesFilter').addEventListener('click', (e) => {
    const btn = e.target.closest('.notes-filter-btn');
    if (!btn) return;
    notesFilter = btn.dataset.filter;
    document.querySelectorAll('.notes-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderNotes();
});

// Close context menu on outside click
document.addEventListener('click', (e) => {
    if (openContextMenu && !openContextMenu.menu.contains(e.target)) {
        closeContextMenu();
    }
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
    // Ctrl+K / Cmd+K to toggle command palette
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        toggleCmdPalette();
        return;
    }
    if (e.key === 'Escape') {
        if (cmdPaletteOpen) { closeCmdPalette(); return; }
        if (openContextMenu) { closeContextMenu(); return; }
        if (detailProject) { closeDetail(); return; }
    }
});

// Listen for tab-activated message from parent
window.addEventListener('message', (e) => {
    if (e.data?.type === 'tab-activated') {
        loadProjects();
        loadNotes();
    }
});

// ── Init ───────────────────────────────────────────────────────────────────
loadActiveProject();
loadProjects();
loadNotes();

// Restore sort preference from localStorage
currentSort = localStorage.getItem('cr-sort') || 'lastActive';
document.getElementById('sortSelect').value = currentSort;

// Restore group-by preference from localStorage
currentGroupBy = localStorage.getItem('cr-groupby') || 'category';
document.getElementById('groupBySelect').value = currentGroupBy;

// Cover gallery: close
document.getElementById('coverGalleryClose').onclick = () => {
    const gallery = document.getElementById('coverGalleryBackdrop');
    gallery.classList.remove('open');
    setTimeout(() => { gallery.style.display = 'none'; }, 150);
};
document.getElementById('coverGalleryBackdrop').addEventListener('click', (e) => {
    if (e.target.id === 'coverGalleryBackdrop') {
        const gallery = document.getElementById('coverGalleryBackdrop');
        gallery.classList.remove('open');
        setTimeout(() => { gallery.style.display = 'none'; }, 150);
    }
});

// Cover gallery: select a cover
document.getElementById('coverGalleryGrid').addEventListener('click', async (e) => {
    const item = e.target.closest('.cover-gallery-item');
    if (!item) return;
    const coverUrl = item.dataset.coverUrl;
    const projectName = item.dataset.project;
    const project = allProjects.find(p => p.name === projectName);
    if (!project) return;

    // If clicking a historical cover, restore it (copy to current)
    if (!item.classList.contains('current')) {
        try {
            await apiFetch(`/api/projects/${encodeURIComponent(projectName)}/cover/restore`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: coverUrl })
            });
            project.cover = `/api/projects/${encodeURIComponent(projectName)}/cover?t=${Date.now()}`;
            showToast('Cover restored!', 'check');
            renderProjects();
        } catch (err) {
            showToast('Failed to restore cover', 'error');
            return;
        }
    }

    // Close gallery
    const gallery = document.getElementById('coverGalleryBackdrop');
    gallery.classList.remove('open');
    setTimeout(() => { gallery.style.display = 'none'; }, 150);
});
</script>
</body>
</html>
